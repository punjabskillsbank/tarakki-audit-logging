spring.application.name=tarakki-audit-logging-service

# Server
server.port=${SERVER_PORT:8085}

# Database
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/tarakki_local}
spring.datasource.username=${DATABASE_USERNAME:tarakki}
spring.datasource.password=${DATABASE_PASSWORD:tarakki}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Kafka configs
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer Configs
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:audit-log-consumer-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

# Error Handling Deserializer configuration
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.tarakki.audit_logging.dto
spring.kafka.consumer.properties.spring.json.value.default.type=com.tarakki.audit_logging.dto.AuditEventMessage

# Topic name
audit.logging.topic=${AUDIT_LOGGING_TOPIC:audit-logging-topic}
